async function saveP(){P.seen=new Date().toISOString();if(P.live){P.lat=me.lat;P.lng=me.lng}if(sb){const{id,name,emoji,services,live,lat,lng,xp,deals,ready,seen,photo,verified,verified_at}=P;const{error}=await sb.from("profiles").upsert({id,name,emoji,services,live,lat,lng,xp,deals,ready,seen,photo,verified,verified_at});if(error)toast("Save failed: "+error.message+" (did you run face.sql?)")}else L.set("nb_p_"+U.id,P)}

let FA;function loadFace(){if(FA)return FA;FA=(async()=>{await new Promise((ok,no)=>{if(window.faceapi)return ok();const s=document.createElement("script");s.src=FACE_JS;s.onload=ok;s.onerror=()=>no(new Error("Could not load the face tools. Check your connection."));document.head.append(s)});

async function onPhoto(inp){const f=inp.files[0];inp.value="";if(!f)return;const m=$("pm");m&&(m.textContent="Checking your photo…");
 try{const url=await pickPhoto(f),fa=await loadFace(),im=new Image();im.src=url;await im.decode();const ds=await fa.detectAllFaces(im,TO(320)).withFaceLandmarks(true).withFaceDescriptors();
  if(ds.length!=1){m&&(m.textContent=ds.length?"More than one face found. Use a photo of just you.":"No face found. Use a clear, well-lit photo of your face.");return}
  const d=Array.from(ds[0].descriptor),ref=await getRef();if(ref&&dist(ref,d)>TH){m&&(m.textContent="This photo doesn’t match your verified face, so it can’t be used.");return}

let stopScan=()=>{};

 let stream,live=true;const end=r=>{live=false;stream&&stream.getTracks().forEach(t=>t.stop());$("ov")?.remove();return r},say=s=>{const i=$("ins");i&&(i.textContent=s)};stopScan=()=>{live=false;window.__r&&window.__r(null)};

 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:480},height:{ideal:480}},audio:false});const v=$("vd");v.srcObject=stream;await v.play()}catch(e){toast("Camera access is needed for the face scan. Allow it in your browser settings.");return end(null)}
 const steps=["blink","left","right"].sort(()=>Math.random()-.5).slice(0,2),txt={blink:"Blink slowly",left:"Turn your head left",right:"Turn your head right"};let ph=0,base=0,bs=[],closed=0,hold=0,t0=Date.now();

  const tick=async()=>{if(!live)return res(end(null));if(Date.now()-t0>30000){toast("Time ran out. Try again.");return res(end(null))}
